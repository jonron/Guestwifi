# reTerminal E1002 (7,3" Spectra 6 färg-ePaper, ESP32-S3) – skylt för gäst-WiFi.
#
# Hämtar dagens lösenord från ESP32-C5:ans /api/display, ritar skylten och sover
# sedan till nästa morgon kl. 04:00 (ESP32-C5 räknar ut sömntiden från sin NTP-tid,
# så varje uppvaknande korrigerar för klockdrift). Når den inte C5 försöker den igen
# om 15 minuter. Skärmen ritas bara om när lösenordet eller batterivarningen ändras.
# Under 10 % batteri visas "Please charge me soon" längst ned.
#
# Höger vit knapp (GPIO4) väcker skärmen och tvingar fram en omritning.
#
# Pinnar och skärmmodell enligt Seeeds ESPHome-dokumentation för reTerminal E1002.
# Kräver ESPHome 2025.11 eller senare.

substitutions:
  name: guestwifi-display
  # Adressen till ESP32-C5:an. Använd helst en fast IP (DHCP-reservation i routern).
  status_url: "http://192.168.40.6/api/display"
  # "false" om logotypen redan finns i bakgrundsbilden.
  draw_logo: "false"

esphome:
  name: ${name}
  friendly_name: Guest WiFi display
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
    - priority: -100
      then:
        - script.execute: refresh_cycle

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB   # E1002 har 32 MB; 16 MB ger gott om plats
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  # E1002 (ESP32-S3) klarar bara 2,4 GHz – använd ett 2,4 GHz-nät som når ESP32-C5:an.
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  fast_connect: true

http_request:
  timeout: 10s
  verify_ssl: false

deep_sleep:
  id: deep_sleep_1
  # Skyddsnät om något hänger sig: sov efter 3 minuter oavsett, försök igen om 15.
  run_duration: 3min
  sleep_duration: 15min
  wakeup_pin: GPIO4            # höger vit knapp
  wakeup_pin_mode: INVERT_WAKEUP

globals:
  # Det som senast hämtades (lever bara medan enheten är vaken).
  - id: g_ssid
    type: std::string
  - id: g_password
    type: std::string
  - id: g_sleep_s           # ersätts av refresh_s från C5; annars nytt försök om 15 min
    type: int
    initial_value: "900"
  - id: g_fetched
    type: bool
    initial_value: "false"
  - id: redraw
    type: bool
    initial_value: "false"
  # Det som står på skärmen just nu – sparas över djupsömn.
  - id: g_shown_hash
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: g_shown_low_batt
    type: bool
    restore_value: yes
    initial_value: "false"

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0  # spänningsdelare

  - platform: template
    id: battery_level
    unit_of_measurement: "%"
    update_interval: never
    lambda: "return id(battery_voltage).state;"
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

script:
  - id: refresh_cycle
    then:
      # Batteri
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      - logger.log:
          format: "Batteri %.2f V, %.0f %%"
          args: ["id(battery_voltage).state", "id(battery_level).state"]

      # Hämta dagens lösenord från ESP32-C5
      - wait_until:
          condition: wifi.connected
          timeout: 30s
      - if:
          condition: wifi.connected
          then:
            - http_request.get:
                url: ${status_url}
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("guestwifi", "HTTP %d från %s", response->status_code, "${status_url}");
                          return;
                        }
                        json::parse_json(body, [](JsonObject root) -> bool {
                          id(g_ssid) = root["ssid"] | "";
                          id(g_password) = root["password"] | "";
                          id(g_sleep_s) = root["refresh_s"] | 900;
                          id(g_fetched) = !id(g_ssid).empty() && !id(g_password).empty();
                          return true;
                        });
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: "Kunde inte nå ESP32-C5 – skärmen behåller sin bild"
          else:
            - logger.log:
                level: WARN
                format: "Ingen WiFi – skärmen behåller sin bild"

      # Rita om bara vid ändring (sparar batteri och undviker blinkande omritningar)
      - lambda: |-
          if (!id(g_fetched)) return;
          // Batterivarning med hysteres: på under 10 %, av först över 15 %.
          const float level = id(battery_level).state;
          bool low = id(g_shown_low_batt);
          if (!std::isnan(level)) low = low ? (level < 15.0f) : (level < 10.0f);
          // FNV-1a över nätnamn + lösenord.
          uint32_t hash = 2166136261u;
          for (char c : id(g_ssid) + "\n" + id(g_password)) { hash ^= (uint8_t) c; hash *= 16777619u; }
          const auto cause = esp_sleep_get_wakeup_cause();
          const bool button = cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1;
          if (hash != id(g_shown_hash) || low != id(g_shown_low_batt) || button) {
            id(g_shown_hash) = hash;
            id(g_shown_low_batt) = low;
            id(redraw) = true;
          }
      - if:
          condition:
            lambda: "return id(redraw);"
          then:
            - logger.log: "Ritar om skärmen"
            - component.update: epaper_display
            - delay: 45s   # en färguppdatering tar runt en halv minut
          else:
            - logger.log: "Oförändrat – ingen omritning"

      # Sov tills nästa kontroll
      - output.turn_off: bsp_battery_enable
      - logger.log:
          format: "Sover %d s"
          args: ["id(g_sleep_s)"]
      - deep_sleep.enter:
          id: deep_sleep_1
          sleep_duration: !lambda "return (uint32_t) id(g_sleep_s) * 1000;"

font:
  - file: "gfonts://Tinos@700"          # Times-liknande serif som i skissen
    id: f_heading
    size: 50
  - file: "gfonts://Montserrat@500"
    id: f_big
    size: 62
  - file: "gfonts://Montserrat@500"
    id: f_mid
    size: 50
  - file: "gfonts://Montserrat@600"
    id: f_note
    size: 26
  - file: "gfonts://IBM Plex Mono@500"   # logotypens typsnitt
    id: f_logo
    size: 18

image:
  # 800x480. Kör tools/epaper_dither.py på ditt foto för bäst resultat på Spectra 6.
  - file: "guestwifi-bg.png"
    id: background
    type: RGB565
    resize: 800x480

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto BLACK = Color(0, 0, 0, 0);
      const auto WHITE = Color(255, 255, 255, 0);
      const auto RED   = Color(255, 0, 0, 0);
      const int CX = 400;

      it.fill(WHITE);
      it.image(0, 0, id(background));

      // Logotyp uppe till höger: ●● VIDEBERG KRAFT med en prick ovanför och under V:et
      if (${draw_logo}) {
        const int tx = 633, ty = 55, r = 6;
        it.filled_circle(tx - 27, ty, r, BLACK);
        it.filled_circle(tx - 14, ty, r, BLACK);
        it.filled_circle(tx + 7, ty - 18, r, BLACK);
        it.filled_circle(tx + 7, ty + 19, r, BLACK);
        it.print(tx, ty, id(f_logo), BLACK, TextAlign::CENTER_LEFT, "VIDEBERG KRAFT");
      }

      it.print(CX, 92, id(f_heading), BLACK, TextAlign::CENTER, "Welcome");
      it.print(CX, 150, id(f_heading), BLACK, TextAlign::CENTER, "Join our guest wifi");

      // Nätnamn och lösenord – byter till mindre storlek om texten inte ryms.
      auto fitted = [&](int y, const std::string &text) {
        int x1, y1, w, h;
        it.get_text_bounds(CX, y, text.c_str(), id(f_big), TextAlign::CENTER, &x1, &y1, &w, &h);
        it.print(CX, y, w > 770 ? id(f_mid) : id(f_big), BLACK, TextAlign::CENTER, text.c_str());
      };
      fitted(258, id(g_ssid));
      fitted(372, id(g_password));

      if (id(g_shown_low_batt)) {
        it.print(CX, 452, id(f_note), RED, TextAlign::CENTER, "Please charge me soon");
      }
