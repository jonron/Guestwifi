; Guest WiFi password rotator
;   esp32c5  Waveshare ESP32-C5 (N16R8), 5 GHz, RGB-lysdiod   <- standard
;   esp32c3  ESP32-C3 med 0.42" SSD1306 OLED (endast 2,4 GHz)
;
;   pio run -e esp32c5 -t upload        bygg + flasha firmware
;   pio run -e esp32c5 -t uploadfs      flasha data/ (typsnitt) till LittleFS
;   tools/make_release.sh               färdiga .bin-filer för flashning från webbläsaren
;   pio test -e native                  kör enhetstester på datorn

[platformio]
default_envs = esp32c5

[env]
lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.2.1

[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv   ; 3 MB app + 896 KB LittleFS (bakgrund + typsnitt)
board_build.embed_txtfiles = src/web/index.html
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c5]
extends = esp32_common
board = esp32-c5-devkitc1-n16r4          ; Waveshare ESP32-C5-WROOM-1 N16R8 (PSRAM-storlek känns av automatiskt)
build_flags =
    ${esp32_common.build_flags}
    -DCFG_HAS_OLED=0

[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
    ${esp32_common.build_flags}
    -DCFG_HAS_OLED=1
lib_deps =
    ${env.lib_deps}
    https://github.com/olikraus/U8g2_Arduino.git#2.35.30

[env:native]
platform = https://github.com/platformio/platform-native.git
build_flags = -std=gnu++17 -Wall -Wextra
test_filter = test_core
